services:
  - type: web
    name: tanya-userbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CMD_PREFIX
        value: "."
      - key: PORT
        value: "10000"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PM_PERMIT
        value: "True"
      - key: MAX_PM_FLOOD
        value: "5"
